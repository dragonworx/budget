# Production stack: Caddy -> api (N replicas) -> Postgres, plus a one-off migrate job.
#   cp deploy/.env.prod.example deploy/.env.prod   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Host-Caddy variant: add -f deploy/docker-compose.host.yml (see docs/deploy.md).
name: budget

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-musicartscience@gmail.com}
  AUTH_ALLOWLIST: ${AUTH_ALLOWLIST:-}
  AUTH_OPEN_SIGNUP: ${AUTH_OPEN_SIGNUP:-false}
  AUTH_INVITES_BYPASS_ALLOWLIST: ${AUTH_INVITES_BYPASS_ALLOWLIST:-true}
  AUTH_DEV_BYPASS: "false"
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  # Only these peers may set X-Forwarded-For (Caddy on the compose network).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  API_HOST: 0.0.0.0
  API_PORT: "8080"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Not published: only reachable on the compose network.

  migrate:
    image: ${API_IMAGE:-budget-api:latest}
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/bin/migrate"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:-budget-api:latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${API_REPLICAS:-2}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: ${WEB_IMAGE:-budget-web:latest}
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN:?set SITE_DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
