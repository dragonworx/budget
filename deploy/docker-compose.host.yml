# Override for a VPS that already runs Caddy on the host (TLS terminated there).
# The bundled Caddy serves plain HTTP on 127.0.0.1:${WEB_PORT:-8081} only; the host
# Caddy proxies the whole site to it (see deploy/caddy-host-snippet).
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.host.yml \
#     --env-file deploy/.env.prod up -d --build
services:
  caddy:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8081}:80"
