# VPS production stack, pulled from GHCR. Lives at /opt/apps/budget/docker-compose.yml
# (CI copies it there on every deploy). Secrets live in /opt/apps/budget/.env.
# Images: ghcr.io/dragonworx/budget-api and budget-web (:latest or :<sha> via IMAGE_TAG).
# Web is served on 127.0.0.1:${WEB_PORT:-8081} (host Caddy) and on the external
# docker network "caddy" as budget-web:80 (containerised Caddy).
name: budget

x-api-env: &api-env
  APP_ENV: production
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-musicartscience@gmail.com}
  AUTH_ALLOWLIST: ${AUTH_ALLOWLIST:-}
  AUTH_OPEN_SIGNUP: ${AUTH_OPEN_SIGNUP:-false}
  AUTH_INVITES_BYPASS_ALLOWLIST: ${AUTH_INVITES_BYPASS_ALLOWLIST:-true}
  AUTH_DEV_BYPASS: "false"
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  API_HOST: 0.0.0.0
  API_PORT: "8080"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: ghcr.io/dragonworx/budget-api:${IMAGE_TAG:-latest}
    command: ["/app/bin/migrate"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/dragonworx/budget-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${API_REPLICAS:-2}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/dragonworx/budget-web:${IMAGE_TAG:-latest}
    container_name: budget-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"   # TLS is terminated by the VPS's Caddy
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    networks: [default, caddy]
    depends_on:
      api:
        condition: service_healthy

networks:
  caddy:
    external: true

volumes:
  pgdata:
