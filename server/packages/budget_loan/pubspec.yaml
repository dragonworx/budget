name: budget_loan
description: >-
  Loan terms (schema v1), their validation, and the bank-style interest maths
  (daily accrual, charge schedules, flat-rate plans, suggested minimums)
  shared by the server's loan walk and (spec 003) the Flutter client.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  budget_recurrence:
    path: ../budget_recurrence
  decimal: ^3.0.2
  rational: ^2.2.3

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0
